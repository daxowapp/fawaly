name: Bug report
description: Report a reproducible problem
body:
  - type: markdown
    attributes:
      value: Please remove credentials, account identifiers and private project content. Security issues belong in the reporting process in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the last successful step and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fawaly version or commit, macOS and Xcode versions
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized screenshot or error message
