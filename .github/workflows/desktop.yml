name: Windows and Linux desktop
on:
  push:
    branches: [feature/windows-linux]
    paths:
      - "Desktop/**"
      - "Scripts/desktop_e2e.py"
      - "Resources/SkillCatalog.json"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "Desktop/**"
      - "Scripts/desktop_e2e.py"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
permissions:
  contents: read
env:
  TAURI_CLI_VERSION: "2.12.4"
  TAURI_DRIVER_VERSION: "2.1.0"
jobs:
  test:
    name: Tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11 libdbus-1-dev pkg-config
      - name: Test the core and engine
        shell: bash
        env:
          REQUIRE_LANDLOCK: ${{ runner.os == 'Linux' && '1' || '' }}
        run: |
          [ -n "$REQUIRE_LANDLOCK" ] || unset REQUIRE_LANDLOCK
          cargo test --manifest-path Desktop/Cargo.toml -p fawaly-core -p fawaly-engine
      - name: System secret store (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo run --manifest-path Desktop/Cargo.toml -p fawaly-engine -- secrets-probe
      - name: System secret store and refusal without one (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --manifest-path Desktop/Cargo.toml -p fawaly-engine
          ENGINE="$PWD/Desktop/target/debug/sudo-interns-engine"
          dbus-run-session -- bash -c "echo -n test | gnome-keyring-daemon --unlock --components=secrets && \"$ENGINE\" secrets-probe"
          if env -u DBUS_SESSION_BUS_ADDRESS DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent "$ENGINE" secrets-probe; then
            echo "must fail closed without a secret service" >&2
            exit 1
          fi
          echo "failed closed as required"

  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, runner: windows-2022, target: x86_64-pc-windows-msvc, bundles: "nsis,msi" }
          - { name: windows-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc, bundles: "nsis,msi" }
          - { name: linux-x64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: "appimage,deb,rpm" }
          - { name: linux-arm64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, bundles: "appimage,deb,rpm" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf rpm file libfuse2 xdg-utils
      - name: Install the Tauri bundler
        shell: bash
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
      - name: Build the bundled engine
        shell: bash
        run: |
          cargo build --manifest-path Desktop/Cargo.toml -p fawaly-engine --release
          mkdir -p Desktop/app/src-tauri/binaries
          suffix=""
          [ "$RUNNER_OS" = "Windows" ] && suffix=".exe"
          cp "Desktop/target/release/sudo-interns-engine$suffix" "Desktop/app/src-tauri/binaries/sudo-interns-engine-${{ matrix.target }}$suffix"
      - name: Build installers
        shell: bash
        working-directory: Desktop/app/src-tauri
        env:
          NO_STRIP: "true"
        run: cargo tauri build --bundles "${{ matrix.bundles }}"
      - name: Record checksums and Windows signature state
        shell: bash
        working-directory: Desktop/target/release/bundle
        run: |
          find . -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec sha256sum {} + | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sudo-interns-${{ matrix.name }}
          if-no-files-found: error
          path: |
            Desktop/target/release/bundle/nsis/*.exe
            Desktop/target/release/bundle/msi/*.msi
            Desktop/target/release/bundle/appimage/*.AppImage
            Desktop/target/release/bundle/deb/*.deb
            Desktop/target/release/bundle/rpm/*.rpm
            Desktop/target/release/bundle/SHA256SUMS.txt

  install-windows:
    name: Install (${{ matrix.runner }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, artifact: windows-x64 }
          - { runner: windows-2025, artifact: windows-x64 }
          - { runner: windows-11-arm, artifact: windows-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sudo-interns-${{ matrix.artifact }}
          path: packages
      - name: Report signature state
        shell: pwsh
        run: |
          Get-ChildItem packages -Recurse -Include *.exe,*.msi | ForEach-Object {
            "$($_.Name): $((Get-AuthenticodeSignature $_.FullName).Status)"
          }
      - name: Install with NSIS, launch, relaunch
        shell: pwsh
        run: |
          $installer = Get-ChildItem packages -Recurse -Filter *setup.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList "/S" -Wait
          $app = "$env:LOCALAPPDATA\Sudo Interns\sudo-interns.exe"
          if (-not (Test-Path $app)) { throw "not installed at $app" }
          "APP_EXE=$app" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          python Scripts/desktop_e2e.py smoke $app
      - name: Install UI test tools
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          cargo install tauri-driver --version "$env:TAURI_DRIVER_VERSION" --locked
          if (-not $env:EDGEWEBDRIVER) { throw "this runner has no Edge driver" }
      - name: Onboarding, real Codex download and registration, scripted task
        shell: pwsh
        env:
          E2E_SCREENSHOTS: ${{ github.workspace }}/e2e-screenshots
        run: |
          $driver = Start-Process tauri-driver -ArgumentList "--native-driver","$env:EDGEWEBDRIVER\msedgedriver.exe" -PassThru
          Start-Sleep 3
          python Scripts/desktop_e2e.py onboarding $env:APP_EXE
          Stop-Process $driver -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-${{ matrix.runner }}
          path: e2e-screenshots
          if-no-files-found: ignore
      - name: Uninstall and confirm removal, including the MCP entry
        shell: pwsh
        run: |
          $uninstaller = "$env:LOCALAPPDATA\Sudo Interns\uninstall.exe"
          if (-not (Test-Path $uninstaller)) { throw "uninstaller missing" }
          Start-Process $uninstaller -ArgumentList "/S" -Wait
          Start-Sleep 5
          if (Test-Path "$env:LOCALAPPDATA\Sudo Interns\sudo-interns.exe") { throw "app files remain" }
          "uninstalled"
      - name: Install and remove the MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem packages -Recurse -Filter *.msi | Select-Object -First 1).FullName
          $process = Start-Process msiexec -ArgumentList "/i","`"$msi`"","/qn","/norestart" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "msi install failed: $($process.ExitCode)" }
          $app = Get-ChildItem "$env:ProgramFiles\Sudo Interns","${env:ProgramFiles(x86)}\Sudo Interns" -Filter sudo-interns.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw "msi did not install the app" }
          python Scripts/desktop_e2e.py smoke $app.FullName
          $process = Start-Process msiexec -ArgumentList "/x","`"$msi`"","/qn","/norestart" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "msi removal failed: $($process.ExitCode)" }
          if (Test-Path $app.FullName) { throw "msi left the app behind" }
          "msi removed"

  install-linux:
    name: Install (${{ matrix.runner }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, artifact: linux-x64 }
          - { runner: ubuntu-24.04, artifact: linux-x64 }
          - { runner: ubuntu-24.04-arm, artifact: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sudo-interns-${{ matrix.artifact }}
          path: packages
      - name: Install the deb and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y "$(find "$PWD/packages" -name '*.deb' | head -1)"
          sudo apt-get install -y xvfb webkit2gtk-driver libfuse2t64 || sudo apt-get install -y xvfb webkit2gtk-driver libfuse2
          test -x /usr/bin/sudo-interns
          test -x /usr/bin/sudo-interns-engine
      - name: Launch and relaunch the deb
        run: xvfb-run -a python3 Scripts/desktop_e2e.py smoke /usr/bin/sudo-interns
      - name: Install UI test tools
        run: |
          rustup toolchain install stable --profile minimal
          cargo install tauri-driver --version "$TAURI_DRIVER_VERSION" --locked
      - name: Onboarding, real Codex download and registration, scripted task
        env:
          E2E_SCREENSHOTS: ${{ github.workspace }}/e2e-screenshots
        run: |
          xvfb-run -a bash -c 'tauri-driver & sleep 3; python3 Scripts/desktop_e2e.py onboarding /usr/bin/sudo-interns'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-${{ matrix.runner }}
          path: e2e-screenshots
          if-no-files-found: ignore
      - name: Remove the deb
        run: |
          sudo apt-get remove -y sudo-interns
          test ! -e /usr/bin/sudo-interns
      - name: Run the AppImage from an extracted copy
        run: |
          image="$(find "$PWD/packages" -name '*.AppImage' | head -1)"
          chmod +x "$image"
          cd "$RUNNER_TEMP"
          "$image" --appimage-extract >/dev/null
          xvfb-run -a python3 "$GITHUB_WORKSPACE/Scripts/desktop_e2e.py" smoke "$RUNNER_TEMP/squashfs-root/usr/bin/sudo-interns"

  install-rpm:
    name: Install (rpm, ${{ matrix.artifact }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, artifact: linux-x64 }
          - { runner: ubuntu-24.04-arm, artifact: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    container: fedora:42
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sudo-interns-${{ matrix.artifact }}
          path: packages
      - name: Install, launch, relaunch and remove
        run: |
          rpm_file="$(find "$PWD/packages" -name '*.rpm' | head -1)"
          dnf install -y "$rpm_file" python3 xorg-x11-server-Xvfb xorg-x11-xauth which
          xvfb-run -a python3 Scripts/desktop_e2e.py smoke /usr/bin/sudo-interns
          dnf remove -y sudo-interns
          test ! -e /usr/bin/sudo-interns

  official-runtimes:
    name: Official CLIs (${{ matrix.runner }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-11-arm, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Download and run every official CLI
        shell: bash
        run: cargo test --manifest-path Desktop/Cargo.toml -p fawaly-core --test official_runtimes -- --ignored --nocapture

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and run pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" -o "$RUNNER_TEMP/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all" --redact=100 --no-banner .
