name: macOS build and tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version
      - name: Build and test without provider accounts
        run: >-
          xcodebuild -project "Fawaly Rebuilt.xcodeproj"
          -scheme "Fawaly Rebuilt" -destination 'platform=macOS'
          -derivedDataPath Build/CI -parallel-testing-enabled NO test
      - name: Check whitespace
        run: git diff --check
  secrets:
    name: Public history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and run pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" -o "$RUNNER_TEMP/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all" --redact=100 --no-banner .
